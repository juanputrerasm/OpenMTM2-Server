# nginx in front of openmtm2d (put this server block in /etc/nginx/sites-available/).
# In server.json: "host": "127.0.0.1", "trustProxy": true. The page then uses wss://rooms.example.org/play
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rooms.example.org;
    ssl_certificate     /etc/letsencrypt/live/rooms.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rooms.example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:47660;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The server pings every 20 s; a quiet socket outlives that.
        proxy_read_timeout 120s;
    }
}
